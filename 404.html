<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YZHC5Z63S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5YZHC5Z63S');
  </script>

  <title>mameon - Page Not Found</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    (function() {
      var defined = {
        '/about': '/#about',
        '/pricing': '/#pricing',
        '/features': '/',
        '/product': '/',
        '/contact': '/#contactSection',
        '/customers': '/#customers',
        '/testimonials': '/#customers',
        '/how-it-works': '/#about',
        '/blog': '/',
        '/privacy': '/privacy.html',
        '/privacy-policy': '/privacy.html',
        '/terms': '/terms.html',
        '/terms-of-service': '/terms.html',
        '/terms-and-conditions': '/terms.html',
        '/signup': 'https://app.mameon.com',
        '/sign-up': 'https://app.mameon.com',
        '/login': 'https://app.mameon.com',
        '/log-in': 'https://app.mameon.com',
        '/index-v1.html': '/'
      };
      var path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (defined[path]) {
        window.location.replace(defined[path]);
      } else if (path.indexOf('/blog/') === 0) {
        window.location.replace('/');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      /* ── PRIMARY BLUE ──
         Hue 221°, matching the ink/grey ramp (~220°) so the blue reads as the
         saturated sibling of the neutrals rather than a bolted-on accent.
         --blue carries white text at 5.2:1 (AA at every size). */
      --blue: #2563EB;
      --blue-hover: #1D4FD8;
      --blue-deep: #16337F;   /* gradient floor + text on tints */
      --blue-lift: #4C8BF9;   /* highlight end of gradients */
      --blue-wash: #EFF4FE;   /* whisper tint for large sections */
      --blue-edge: #D7E3FB;   /* border that sits on the wash */
      --btn: #2563EB;
      --btn-hover: #1D4FD8;
      --white: #ffffff;
      --gray: #545b69;
      --gray-dark: #656C7B;
      --ink: #0f1420;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      /* match the other pages: guard against any accidental horizontal scroll */
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      min-height: 100vh;
    }

    h1, h2 {
      font-family: var(--font-heading);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-lift) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    p {
      font-size: 1rem;
      color: var(--gray);
      line-height: 1.6;
      max-width: 440px;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 14px 32px;
      background: var(--btn);
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--font-body);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(37,99,235,0.26);
    }

    .btn:hover {
      background: var(--btn-hover);
      box-shadow: 0 10px 26px rgba(37,99,235,0.34);
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo img:first-child { height: 50px; }
    .logo img:last-child { height: 30px; }

    @media (max-width: 640px) {
      .logo { left: 20px; top: 16px; }
      .logo img:first-child { height: 36px; }
      .logo img:last-child { height: 20px; }
    }

    /* ── FOCUS RING ──
       There was no :focus-visible styling anywhere on the site, and the contact
       input additionally set outline:none — keyboard users had no indicator at
       all. The brand blue doubles as the ring; it inverts to white on the dark
       chrome and the blue panels, where a blue ring would vanish. */
    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    .nav :focus-visible,
    .mobile-menu :focus-visible,
    .footer :focus-visible,
    #hero .hero-card :focus-visible,
    .cta-inner :focus-visible {
      outline-color: #fff;
    }
  </style>
</head>
<body>
  <a href="/" class="logo">
    <img src="/logo.png" alt="mameon logo" />
    <img src="/wordmark.png" alt="mameon" />
  </a>
  <div class="error-code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
  <a href="/" class="btn">Back to mameon.com</a>
  <!-- GA4: track signup / login CTA clicks (delegated, so buttons added later are covered too) -->
  <script>
    document.addEventListener('click', function (e) {
      if (!e.target || !e.target.closest) return;
      var btn = e.target.closest('a[href^="https://app.mameon.com"]');
      if (!btn) return;
      gtag('event', 'signup_click', {
        button_location: btn.dataset.location || 'unknown',
        link_text: (btn.textContent || '').trim(),
        transport_type: 'beacon'
      });
    });
  </script>
</body>
</html>
